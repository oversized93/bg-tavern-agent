[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgagent"
version = "0.1.0"
description = "Hearthstone Battlegrounds recommendation agent trained with PPO in TavernGym"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.4",
    "tensorboard",
    # TavernGym (MIT, MCG-NJU/AutoTavern), pinned to the commit this code was built against.
    # Building it needs a Rust toolchain; see docs/SETUP_WSL2.md.
    "taverngym @ git+https://github.com/MCG-NJU/AutoTavern@fb61201a557ddd36a411cf44aac51ce4d9b606ce",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["bgagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
